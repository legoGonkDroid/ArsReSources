# Builds Ars ReSources and publishes it when a version tag is pushed:
#   git tag v0.0.2 && git push origin v0.0.2
# The tag (without "v") must equal mod_version in gradle.properties.
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   secret   CURSEFORGE_TOKEN       CurseForge API token (https://legacy.curseforge.com/account/api-tokens)
#   variable CURSEFORGE_PROJECT_ID  numeric Project ID shown in the CurseForge project's "About Project" box
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$VERSION in gradle.properties"
            exit 1
          fi
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --no-configuration-cache

      - name: GameTests
        run: ./gradlew runGameTestServer --no-configuration-cache

      - name: Publish to CurseForge and GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/ars_resources-*.jar
          name: Ars ReSources ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            ars_nouveau(required){curseforge:ars-nouveau}
            ars_deco(optional){curseforge:ars-deco}
            emi(optional){curseforge:emi}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ars_resources-jar
          path: build/libs/*.jar
