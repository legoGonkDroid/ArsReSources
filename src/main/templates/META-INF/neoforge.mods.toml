modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ars_nouveau"
type = "required"
versionRange = "${ars_nouveau_version_range}"
ordering = "AFTER"
side = "BOTH"

# Optional: when present, the Source Vessel can be dyed like other Ars blocks.
[[dependencies.${mod_id}]]
modId = "ars_deco"
type = "optional"
versionRange = "[1.21.1-5.0,)"
ordering = "AFTER"
side = "BOTH"
